# GitHub mirror of the GitLab pipeline's verification stages, plus an e2e run of
# the Blue-Green flow on kind. Deploy stages exist only in .gitlab-ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate every delivery mode
        run: |
          helm lint deploy/helm/microservice -f deploy/helm/values/orders/common.yaml -f deploy/helm/values/orders/prod.yaml --set image.tag=ci
          for args in \
            "-f deploy/helm/values/orders/common.yaml -f deploy/helm/values/orders/prod.yaml --set image.tag=a" \
            "-f deploy/helm/values/orders/common.yaml -f deploy/helm/values/orders/prod.yaml --set image.tag=a --set canary.enabled=true --set canary.tag=b" \
            "-f deploy/helm/values/catalog/common.yaml -f deploy/helm/values/catalog/prod.yaml --set blueGreen.blue.tag=a --set blueGreen.green.tag=b"; do
            echo "::group::helm template $args"
            helm template t deploy/helm/microservice $args | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  rules-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v2.54.1 check rules observability/rules/slo.yaml
          docker run --rm -v "$PWD:/w" -w /w/observability/rules/tests --entrypoint promtool prom/prometheus:v2.54.1 test rules slo_test.yaml
      - run: shellcheck scripts/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest scripts/ -q

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, orders]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shop/${{ matrix.service }}:ci
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shop/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: docker image ls shop/${{ matrix.service }}:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  e2e-blue-green:
    runs-on: ubuntu-latest
    needs: [go, helm]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: shop-e2e
      - run: ./scripts/e2e-kind.sh
        env:
          CLUSTER: shop-e2e
