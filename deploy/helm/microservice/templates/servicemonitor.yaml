{{- if .Values.serviceMonitor.enabled }}
# PodMonitor (not ServiceMonitor) so stable, canary and both blue-green colors are
# scraped regardless of which Service currently selects them. Labels `app` and
# `track` are what SLO rules and the canary analysis query by.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ms.selector" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
        - sourceLabels: [__meta_kubernetes_pod_label_track]
          targetLabel: track
        - sourceLabels: [__meta_kubernetes_pod_label_color]
          targetLabel: color
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
{{- end }}
