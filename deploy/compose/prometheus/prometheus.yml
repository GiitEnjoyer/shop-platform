global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: local

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: shop
    static_configs:
      - targets: ["catalog:8080"]
        labels:
          app: catalog
          namespace: shop
          track: stable
      - targets: ["orders:8080"]
        labels:
          app: orders
          namespace: shop
          track: stable
